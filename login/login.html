<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&family=Cormorant+Garamond:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cormorant Garamond', serif;
            background: linear-gradient(to right, #ece9e6, #ffffff);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .signup-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"],
        input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        input[type="radio"] {
            margin-right: 8px;
        }
        .role-options {
            margin-bottom: 20px;
        }
        .designer-fields {
            display: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #555;
        }
        #preview {
            max-height: 100px;
            display: none;
            margin-top: 10px;
        }
        #registrationMessage {
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="signup-container">
        <h2>Signup</h2>
        <form id="signupForm">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <div class="role-options">
                <label>
                    <input type="radio" name="role" value="designer" onchange="showDesignerFields()"> Designer
                </label>
                <label>
                    <input type="radio" name="role" value="user" onchange="hideDesignerFields()" checked> User
                </label>
            </div>

            <div id="designerFields" class="designer-fields">
                <label for="image">Upload Profile Image:</label>
                <input type="file" id="image" name="image" accept="image/*">
                <img id="preview" src="" alt="Image Preview">
                
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone">
            </div>

            <button type="submit">Signup</button>
            <div id="registrationMessage"></div>
        </form>
    </div>

    <script>
        function showDesignerFields() {
            document.getElementById("designerFields").style.display = "block";
        }

        function hideDesignerFields() {
            document.getElementById("designerFields").style.display = "none";
        }

        // Preview Image
        document.getElementById("image").addEventListener("change", function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById("preview").src = event.target.result;
                    document.getElementById("preview").style.display = "block";
                }
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('signupForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const formData = new FormData(this);

            fetch('http://localhost:8000/register', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                const messageDiv = document.getElementById('registrationMessage');
                if (data.status === "success") {
                    messageDiv.textContent = data.message;
                    messageDiv.style.color = "green";
                } else {
                    messageDiv.textContent = data.message;
                    messageDiv.style.color = "red";
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Signup failed. Please try again.');
            });
        });
    </script>
</body>
</html>
